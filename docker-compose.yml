services:
  # -------------------------------------------------------
  # PostgreSQL with pgvector extension
  # -------------------------------------------------------
  db:
    image: pgvector/pgvector:pg16
    container_name: dreamcatcher_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dreamcatcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dreamcatcher_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dreamcatcher}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dreamcatcher} -d ${POSTGRES_DB:-dreamcatcher}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------
  # FastAPI Backend
  # -------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dreamcatcher_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dreamcatcher}:${POSTGRES_PASSWORD:-dreamcatcher_dev_password}@db:5432/${POSTGRES_DB:-dreamcatcher}
      VECTOR_DIM: ${VECTOR_DIM:-768}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      USE_VERTEX_AI: ${USE_VERTEX_AI:-true}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-dreamcatcher-507515}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-004}
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
    driver: local
